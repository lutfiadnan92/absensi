<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pencatatan Absensi Sederhana</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load html2pdf for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Load Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f3f4f6;
      }
    </style>
  </head>
  <body class="antialiased text-gray-800 min-h-screen flex justify-center p-4 sm:p-8">

    <!-- Main Container -->
    <div
      id="app-container"
      class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden self-start mt-4 sm:mt-10 transition-all"
    >
        
      <!-- Header Section -->
      <div
        class="bg-blue-600 text-white px-6 py-5 flex flex-col sm:flex-row justify-between items-center gap-4"
      >
        <div class="text-center sm:text-left">
          <h1 class="text-2xl font-bold">Laporan Absensi</h1>
          <p class="text-blue-100 text-sm mt-1" id="current-date">Memuat tanggal...</p>
        </div>
        <button
          id="export-pdf-btn"
          class="no-export bg-white text-blue-600 hover:bg-blue-50 font-semibold py-2 px-4 rounded-lg shadow-sm transition-colors text-sm flex items-center"
        >
          <svg
            class="w-4 h-4 mr-2"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          ><path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
            ></path></svg>
          Export PDF
        </button>
      </div>

      <div class="p-6">
        <!-- Pengaturan Judul Laporan -->
        <div class="no-export mb-6 bg-blue-50 p-5 rounded-xl border border-blue-100">
          <label for="jenis-sambung" class="block text-sm font-semibold text-blue-800 mb-2">Jenis Sambung (Untuk Judul Laporan PDF)</label>
          <input
            type="text"
            id="jenis-sambung"
            placeholder="Contoh: Reguler, Shift Pagi, dll..."
            class="w-full md:w-1/2 px-4 py-2 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white"
          >
        </div>

        <!-- Form Input (Will be hidden during PDF export) -->
        <form
          id="attendance-form"
          class="no-export mb-8 bg-gray-50 p-5 rounded-xl border border-gray-200"
        >
          <h2 class="text-lg font-semibold mb-4 text-gray-700">Catat Kehadiran</h2>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    
            <div class="md:col-span-2">
              <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
              <input
                type="text"
                id="name"
                required
                placeholder="Masukkan nama..."
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
              >
            </div>
                    
            <div>
              <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Status</label>
              <select
                id="status"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white"
              >
                <option value="Hadir">Hadir</option>
                <option value="Tidak Hadir">Tidak Hadir</option>
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
              </select>
            </div>

            <div>
              <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg shadow transition-colors"
              >
                Simpan
              </button>
            </div>
          </div>
        </form>

        <!-- Table Section -->
        <div class="overflow-x-auto rounded-lg border border-gray-200">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th
                  scope="col"
                  class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider w-16"
                >No</th>
                <th
                  scope="col"
                  class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider"
                >Nama</th>
                <th
                  scope="col"
                  class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider"
                >Status</th>
                <th
                  scope="col"
                  class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider"
                >Waktu</th>
                <!-- Aksi column hidden during export -->
                <th
                  scope="col"
                  class="no-export px-6 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider w-24"
                >Aksi</th>
              </tr>
            </thead>
            <tbody id="table-body" class="bg-white divide-y divide-gray-200">
              <!-- Data will be populated here via JavaScript -->
            </tbody>
          </table>
        </div>

        <!-- Empty State Message -->
        <div id="empty-state" class="text-center py-10 hidden">
          <svg
            class="mx-auto h-12 w-12 text-gray-300"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
            />
          </svg>
          <h3 class="mt-2 text-sm font-medium text-gray-900">Belum ada data</h3>
          <p class="mt-1 text-sm text-gray-500">Mulai catat absensi dengan mengisi form di atas.</p>
        </div>
            
        <!-- Clear All Button -->
        <div class="mt-4 flex justify-end no-export">
          <button
            id="clear-all-btn"
            class="text-red-600 hover:text-red-800 text-sm font-medium transition-colors hidden"
          >
            Hapus Semua Data
          </button>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // State untuk menyimpan data absensi
        let records = [];

        // Referensi Elemen DOM
        const form = document.getElementById("attendance-form");
        const nameInput = document.getElementById("name");
        const statusInput = document.getElementById("status");
        const tableBody = document.getElementById("table-body");
        const emptyState = document.getElementById("empty-state");
        const clearAllBtn = document.getElementById("clear-all-btn");
        const dateDisplay = document.getElementById("current-date");
        const exportPdfBtn = document.getElementById("export-pdf-btn");

        // Set Tanggal Hari Ini di Header
        const options = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
        dateDisplay.textContent = new Date().toLocaleDateString("id-ID", options);

        // Fungsi untuk me-render tabel
        function renderTable() {
          tableBody.innerHTML = "";

          if (records.length === 0) {
            emptyState.classList.remove("hidden");
            clearAllBtn.classList.add("hidden");
            tableBody.parentElement.classList.add("hidden");
          } else {
            emptyState.classList.add("hidden");
            clearAllBtn.classList.remove("hidden");
            tableBody.parentElement.classList.remove("hidden");

            records.forEach((record, index) => {
              const tr = document.createElement("tr");
              tr.className = "hover:bg-gray-50 transition-colors";

              // Menentukan warna badge berdasarkan status
              let statusColor = "bg-green-100 text-green-800"; // Hadir
              if (record.status === "Tidak Hadir") statusColor = "bg-red-100 text-red-800";
              else if (record.status === "Izin") statusColor = "bg-yellow-100 text-yellow-800";
              else if (record.status === "Sakit") statusColor = "bg-orange-100 text-orange-800";

              // Menampilkan "-" jika tidak hadir/izin/sakit, sebaliknya tampilkan jam
              const timeDisplay = record.status === "Hadir" ? record.time : "-";

              tr.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${index + 1}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 capitalize">${record.name}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusColor}">
                                    ${record.status}
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${timeDisplay}</td>
                            <td class="no-export px-6 py-4 whitespace-nowrap text-center text-sm font-medium">
                                <button onclick="deleteRecord(${record.id})" class="text-red-500 hover:text-red-700 transition-colors" title="Hapus">
                                    <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </td>
                        `;
              tableBody.appendChild(tr);
            });
          }
        }

        // Fungsi untuk menghapus satu baris data
        window.deleteRecord = function (id) {
          records = records.filter((record) => record.id !== id);
          renderTable();
        };

        // Event Submit Form
        form.addEventListener("submit", (e) => {
          e.preventDefault();

          const name = nameInput.value.trim();
          const status = statusInput.value;

          // Ambil jam saat ini (HH:MM)
          const now = new Date();
          const time = now.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });

          if (name) {
            records.push({
              id: Date.now(),
              name: name,
              status: status,
              time: time,
            });

            // Reset form & update UI
            nameInput.value = "";
            statusInput.value = "Hadir"; // reset to default
            renderTable();
          }
        });

        // Event Hapus Semua Data
        clearAllBtn.addEventListener("click", () => {
          records = [];
          renderTable();
        });

        // Event Export PDF
        exportPdfBtn.addEventListener("click", () => {
          if (records.length === 0) return; // Jangan print jika kosong

          // Ambil nilai jenis sambung
          const jenisSambungInput = document.getElementById("jenis-sambung").value.trim();
          const jenisSambung = jenisSambungInput ? jenisSambungInput : "-";

          // Format tanggal untuk PDF (Contoh: "24 September 2026")
          const pdfDate = new Date().toLocaleDateString("id-ID", {
            day: "numeric",
            month: "long",
            year: "numeric",
          });

          // 1. Buat HTML String untuk layout PDF yang bersih dengan tabel biasa ber-border
          let tableRows = "";
          records.forEach((record, index) => {
            const timeDisplay = record.status === "Hadir" ? record.time : "-";
            tableRows += `
                        <tr>
                            <td style="border: 1px solid #000; padding: 10px; text-align: center;">${index + 1}</td>
                            <td style="border: 1px solid #000; padding: 10px; text-transform: capitalize;">${record.name}</td>
                            <td style="border: 1px solid #000; padding: 10px; text-align: center;">${record.status}</td>
                            <td style="border: 1px solid #000; padding: 10px; text-align: center;">${timeDisplay}</td>
                        </tr>
                    `;
          });

          const pdfContent = `
                    <div style="font-family: Arial, sans-serif; padding: 20px; color: #000; background-color: #fff;">
                        <h2 style="text-align: center; margin-bottom: 5px; font-size: 20px; font-weight: bold; text-transform: uppercase;">
                            Absensi ${jenisSambung}
                        </h2>
                        <p style="text-align: center; margin-top: 0; margin-bottom: 20px; font-size: 14px; color: #555;">
                            ${pdfDate}
                        </p>
                        <table style="width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px;">
                            <thead>
                                <tr style="background-color: #f2f2f2;">
                                    <th style="border: 1px solid #000; padding: 10px; text-align: center; width: 10%;">No</th>
                                    <th style="border: 1px solid #000; padding: 10px; text-align: left; width: 45%;">Nama</th>
                                    <th style="border: 1px solid #000; padding: 10px; text-align: center; width: 25%;">Status</th>
                                    <th style="border: 1px solid #000; padding: 10px; text-align: center; width: 20%;">Waktu</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRows}
                            </tbody>
                        </table>
                    </div>
                `;

          // 2. Konfigurasi html2pdf
          const opt = {
            margin: [0.5, 0.5, 0.5, 0.5],
            filename: `Laporan_Absensi_${new Date().toISOString().split("T")[0]}.pdf`,
            image: { type: "jpeg", quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: "in", format: "a4", orientation: "portrait" },
          };

          // 3. Eksekusi print dari template string HTML khusus yang dibuat
          html2pdf()
            .set(opt)
            .from(pdfContent)
            .save()
            .catch((err) => {
              console.error("Gagal export PDF:", err);
            });
        });

        // Initial render
        renderTable();
      });
    </script>
  </body>
</html>

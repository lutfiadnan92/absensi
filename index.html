<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pencatatan Absensi Sederhana</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load html2pdf for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Load SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Load Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="./style.css">
  </head>
  <body class="antialiased text-gray-800 min-h-screen flex justify-center p-4 sm:p-8">

    <!-- Login Container -->
    <div
      id="login-container"
      class="w-full max-w-sm bg-white rounded-2xl shadow-xl overflow-hidden self-center p-8 transition-all"
    >
      <div class="text-center mb-6">
        <div
          class="inline-flex items-center justify-center w-12 h-12 bg-blue-100 rounded-full mb-4"
        >
          <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"
            ></path></svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-800">Login Admin</h2>
        <p class="text-sm text-gray-500 mt-1">Silakan masuk untuk mencatat absensi</p>
      </div>
      <form id="login-form">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input
            type="text"
            id="username"
            required
            autofocus
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
          >
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input
            type="password"
            id="password"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
          >
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors"
        >
          Masuk
        </button>
      </form>
      <div class="mt-4 text-center">
        <p class="text-xs text-gray-400">Default Username: <span class="font-bold text-gray-600">admin</span> | Password: <span class="font-bold text-gray-600">admin123</span></p>
      </div>
    </div>

    <!-- Main Container -->
    <div
      id="app-container"
      class="hidden w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden self-start mt-4 sm:mt-10 transition-all"
    >
        
      <!-- Header Section -->
      <div
        class="bg-blue-600 text-white px-6 py-5 flex flex-col sm:flex-row justify-between items-center gap-4"
      >
        <div class="text-center sm:text-left">
          <h1 class="text-2xl font-bold">Laporan Absensi</h1>
          <p class="text-blue-100 text-sm mt-1" id="current-date">Memuat tanggal...</p>
        </div>
        <div class="flex gap-2">
          <button
            id="export-pdf-btn"
            class="no-export bg-white text-blue-600 hover:bg-blue-50 font-semibold py-2 px-4 rounded-lg shadow-sm transition-colors text-sm flex items-center"
          >
            <svg
              class="w-4 h-4 mr-2"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            ><path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              ></path></svg>
            Export PDF
          </button>
          <button
            id="logout-btn"
            class="no-export bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow-sm transition-colors text-sm flex items-center"
          >
            Logout
          </button>
        </div>
      </div>

      <div class="p-6">
        <!-- Pengaturan Judul Laporan -->
        <div class="no-export mb-6 bg-blue-50 p-5 rounded-xl border border-blue-100">
          <label for="jenis-sambung" class="block text-sm font-semibold text-blue-800 mb-2">Jenis Sambung (Untuk Judul Laporan PDF)</label>
          <input
            type="text"
            id="jenis-sambung"
            placeholder="Contoh: Reguler, Shift Pagi, dll..."
            class="w-full md:w-1/2 px-4 py-2 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white"
          >
        </div>

        <!-- Form Input (Will be hidden during PDF export) -->
        <form
          id="attendance-form"
          class="no-export mb-8 bg-gray-50 p-5 rounded-xl border border-gray-200"
        >
          <h2 class="text-lg font-semibold mb-4 text-gray-700">Catat Kehadiran</h2>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    
            <div class="md:col-span-2">
              <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
              <input
                type="text"
                id="name"
                required
                placeholder="Masukkan nama..."
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
              >
            </div>
                    
            <div>
              <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Status</label>
              <select
                id="status"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white"
              >
                <option value="Hadir">Hadir</option>
                <option value="Tidak Hadir">Tidak Hadir</option>
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
              </select>
            </div>

            <div>
              <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg shadow transition-colors"
              >
                Simpan
              </button>
            </div>
          </div>
        </form>

        <!-- Table Section -->
        <div class="overflow-x-auto rounded-lg border border-gray-200">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th
                  scope="col"
                  class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider w-16"
                >No</th>
                <th
                  scope="col"
                  class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider"
                >Nama</th>
                <th
                  scope="col"
                  class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider"
                >Status</th>
                <th
                  scope="col"
                  class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider"
                >Waktu</th>
                <!-- Aksi column hidden during export -->
                <th
                  scope="col"
                  class="no-export px-6 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider w-24"
                >Aksi</th>
              </tr>
            </thead>
            <tbody id="table-body" class="bg-white divide-y divide-gray-200">
              <!-- Data will be populated here via JavaScript -->
            </tbody>
          </table>
        </div>

        <!-- Empty State Message -->
        <div id="empty-state" class="text-center py-10 hidden">
          <svg
            class="mx-auto h-12 w-12 text-gray-300"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
            />
          </svg>
          <h3 class="mt-2 text-sm font-medium text-gray-900">Belum ada data</h3>
          <p class="mt-1 text-sm text-gray-500">Mulai catat absensi dengan mengisi form di atas.</p>
        </div>
            
        <!-- Clear All Button -->
        <div class="mt-4 flex justify-end no-export">
          <button
            id="clear-all-btn"
            class="text-red-600 hover:text-red-800 text-sm font-medium transition-colors hidden"
          >
            Hapus Semua Data
          </button>
        </div>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>

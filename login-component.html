<div
  class="w-full bg-white rounded-2xl shadow-xl overflow-hidden p-6 sm:p-8 border border-gray-100 transition-all"
>
  <div class="text-center mb-6">
    <div
      class="inline-flex items-center justify-center w-12 h-12 bg-blue-100 rounded-full mb-3 text-blue-600"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"
        >
        </path>
      </svg>
    </div>
    <h2 class="text-2xl font-bold text-gray-800">Login Sistem Absensi</h2>
    <p class="text-gray-500 mt-1 text-xs">Masuk dengan akun email yang telah didaftarkan untuk mengelola data</p>
  </div>
  <form @submit.prevent="runButtonAction('login', () => handleLogin())">
    <div class="mb-4">
      <label for="login-email" class="block font-semibold text-gray-600 mb-1">Email</label>
      <input
        id="login-email"
        type="email"
        x-model="loginInput.email"
        required
        autocomplete="username"
        placeholder="nama@email.com"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
      >
    </div>
    <div class="mb-6">
      <label for="login-password" class="block font-semibold text-gray-600 mb-1">Password</label>
      <input
        id="login-password"
        :type="showPassword ? 'text' : 'password'"
        x-model="loginInput.password"
        required
        autocomplete="current-password"
        placeholder="Masukkan password"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
      >
      <label
        for="show-login-password"
        class="mt-2 inline-flex items-center gap-2 text-sm text-gray-600 cursor-pointer"
      >
        <input
          id="show-login-password"
          type="checkbox"
          x-model="showPassword"
          class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"
        >
        Tampilkan password
      </label>
    </div>
    <button
      type="submit"
      :disabled="loadingAction === 'login'"
      class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 disabled:cursor-not-allowed text-white font-medium py-2.5 px-4 rounded-lg transition-colors shadow text-sm"
    >
      <svg
        x-show="loadingAction === 'login'"
        class="inline w-4 h-4 mr-1 animate-spin"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
      </svg>
      <span>Masuk Aplikasi</span>
    </button>
  </form>
  <div class="mt-5 p-3 bg-gray-50 rounded-lg border border-gray-200 text-xs text-gray-500">
    Akun dibuat di database. Hubungi admin jika belum memiliki akses.
  </div>
</div>
